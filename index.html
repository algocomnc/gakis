<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gakis — Îlot Maître</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>summary::-webkit-details-marker{display:none}summary{list-style:none}
:root{--deep:#015450;--deep2:#013f3c;--lagon:#0f9a92;--aqua:#e3f6f4;--aqua2:#cdeeea;--mint:#96fef9;--corail:#eb6834;--corail-bg:#fdeee6;--corail-ink:#a8401a;
  --ink:#0d2b2a;--mut:#56706e;--bg:#f2f6f5;--card:#fff;--line:#e2ebea;--ok:#0f8a6a;--warn:#c2410c;--amber-bg:#fff3d9;--amber-ink:#7a4d00;
  --blue:var(--deep);--r:16px;--sh:0 1px 2px #0d2b2a0d,0 6px 20px -8px #0d2b2a26;--disp:'Rubik',system-ui,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 'Work Sans',-apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);caret-color:var(--lagon);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--mint);color:var(--deep2)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 16px}header img{height:46px;width:46px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:var(--sh)}
h1{font:600 21px/1.15 var(--disp);margin:0;letter-spacing:-.01em;color:var(--deep)}
h2{font:600 19px/1.2 var(--disp);margin:28px 0 10px;color:var(--deep);letter-spacing:-.01em}h2 .mut{font-family:'Work Sans',sans-serif;font-weight:500}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
input,select,textarea{-webkit-appearance:none;appearance:none;width:100%;min-width:0;display:block;min-height:48px;font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fbfdfd;color:var(--ink);transition:border-color .15s,box-shadow .15s}
select{padding-right:36px;background:#fbfdfd url("data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org/2000/svg' width='12' height='8'%3E%3Cpath d='M1 1l5 5 5-5' fill='none' stroke='%2356706e' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 14px center}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--lagon);box-shadow:0 0 0 4px #0f9a9226;background-color:#fff}
::placeholder{color:#8aa09e}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button,.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:14px;padding:13px 18px;min-height:48px;background:var(--deep);color:#fff;cursor:pointer;
  transition:transform .12s cubic-bezier(.2,.8,.2,1),background-color .15s,box-shadow .15s,opacity .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{background:var(--deep2)}button:active{transform:scale(.97)}
button:focus-visible,summary:focus-visible,a:focus-visible,.dep:focus-visible{outline:3px solid var(--lagon);outline-offset:2px}
button.sec{background:var(--aqua);color:var(--deep)}button.sec:hover{background:var(--aqua2)}
button.ok{background:var(--lagon)}button.ok:hover{background:#0c837c}
button.no{background:var(--corail-bg);color:var(--corail-ink)}button.no:hover{background:#fbdccc}
button.sm{padding:8px 13px;min-height:38px;font-size:14px;border-radius:11px}button:disabled{opacity:.55;cursor:default;transform:none}
.big{width:100%;font-size:18px;padding:17px;min-height:58px;border-radius:16px;box-shadow:0 8px 20px -8px #01545080;margin-top:6px}
.dep{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent;transition:border-color .15s,box-shadow .15s}
.dep.sel{border-color:var(--deep);box-shadow:0 0 0 4px #0154501a,var(--sh)}
.dep .seats{flex:none;font-size:14px;font-weight:600;color:var(--deep);background:var(--aqua);border-radius:999px;padding:6px 12px}
.dep.sel .seats{background:var(--deep);color:#fff}
.time{font:600 26px/1.1 var(--disp);color:var(--deep)}
.seg{display:flex;gap:4px;padding:4px;background:#e4eceb;border-radius:14px}
.seg button{flex:1;background:transparent;color:var(--mut);font-weight:600;font-size:15px;padding:10px 8px;min-height:44px;border-radius:11px;line-height:1.2}
.seg button:hover{background:#ffffff80;color:var(--ink)}
.seg button.on{background:#fff;color:var(--deep);box-shadow:0 1px 2px #0d2b2a1f,0 2px 8px -2px #0d2b2a26}
.chip{display:inline-block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px #0d2b2a33;vertical-align:-3px;margin-right:5px;flex:none}
.err{color:var(--warn);font-weight:600;margin:10px 0;background:var(--corail-bg);padding:10px 14px;border-radius:12px}.err:empty{display:none}
.total{font:600 24px/1.2 var(--disp);color:var(--deep);text-align:right;margin:16px 0 4px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#eef3f2;color:var(--mut)}.tag.p{background:#dcf3ea;color:var(--ok)}.tag.a{background:var(--amber-bg);color:var(--amber-ink)}.tag.x{background:var(--corail-bg);color:var(--corail-ink)}
.code{font:600 54px/1 var(--disp);letter-spacing:.08em;text-align:center;color:var(--deep);margin:6px 0 10px}
.confirm{text-align:center;padding:26px 18px;animation:rise .5s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.skip .now{font:600 56px/1 var(--disp);color:var(--deep);letter-spacing:-.02em}.skip .row>div:last-child{flex:none}.skip .seats{font:600 44px/1 var(--disp);color:var(--deep)}
.bar{height:8px;border-radius:99px;background:#e4eceb;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--lagon);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;font-weight:600;color:var(--mut)}tr:last-child td{border-bottom:0}td.n,th.n{text-align:right;white-space:nowrap}
.hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:14px;background:var(--deep);box-shadow:var(--sh)}
.hero img{display:block;width:100%;height:230px;object-fit:cover}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:56px 20px 22px;color:#fff;background:linear-gradient(transparent,#01312ecc);font-size:14px}
.hero .cap b{font:600 30px/1.1 var(--disp);display:block;margin-bottom:4px;letter-spacing:-.01em}.hero svg{display:none}
.vivre{list-style:none;padding:0;margin:0;text-align:left}.vivre li{padding:12px 0 12px 52px;position:relative;border-bottom:1px solid var(--line)}.vivre li:last-child{border:0}
.vivre li>span:first-child{position:absolute;left:0;top:10px;width:38px;height:38px;border-radius:12px;background:var(--aqua);display:grid;place-items:center;font-size:19px}
.x{text-decoration:line-through;opacity:.5}a{color:var(--deep);text-underline-offset:3px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.links a{display:flex;align-items:center;justify-content:center;min-height:42px;padding:8px;border-radius:12px;background:#fff;box-shadow:var(--sh);text-decoration:none;font-weight:600;font-size:14px;color:var(--deep)}
.links a:active{transform:scale(.97)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions>*{flex:1 1 auto;width:auto}.actions select{flex:1 1 160px}
.pass{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.pass>span:last-child{text-align:right;margin-left:auto;font-size:14px}
.dep a[href^=tel]{white-space:nowrap;flex:none}
.sum::after{content:'';flex:none;width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translateY(-3px);margin:0 4px 0 6px;transition:transform .2s}details[open]>.sum::after{transform:rotate(225deg) translateY(-2px)}
.sum{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 0;min-height:44px}
.depline{border-bottom:1px solid var(--line);padding:10px 0}.depline:last-child{border-bottom:0}
.flash{display:inline-block;margin-left:10px;font-weight:600}
.alert{background:var(--amber-bg);color:var(--amber-ink);border-radius:12px;padding:10px 14px;font-weight:700}
.brace{display:inline-block;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px #0d2b2a33,0 0 0 3px #fff,0 0 0 4px #0d2b2a1a;vertical-align:-6px;margin-right:8px}
.closed{background:var(--corail-bg)}.closed b{color:var(--corail-ink)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}.tiles.two{grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:18px;padding:12px 10px 11px;box-shadow:var(--sh);min-width:0}.two .tile{padding:14px}
.tile b{display:block;font:600 24px/1.1 var(--disp);color:var(--ink);margin-top:10px;white-space:nowrap}.two .tile b{font-size:28px}
.tile small{display:block;font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c)}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.paq{padding:4px 16px}.pq{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.pq:last-child{border-bottom:0}
.pq b{font-weight:600}.pq .tag{font-size:11px;padding:2px 8px}.pj{flex:none;width:86px;font-size:13px;font-weight:600;color:var(--deep)}.pq.auj .pj{color:var(--warn)}
.pn{text-align:right;flex:none}.pn b{display:block;font:600 19px/1.1 var(--disp);color:var(--deep)}.pn small{font-size:11px;color:var(--mut)}
.hl{background:linear-gradient(135deg,var(--deep) 0%,#0b7a73 100%);color:#fff;border-radius:22px;padding:18px 18px 16px;box-shadow:0 14px 28px -14px #015450b3;margin:4px 0 10px}
.hl small{display:block;font-size:13px;color:#cdeeea}.hl b{display:block;font:600 34px/1.1 var(--disp);margin:4px 0 2px;letter-spacing:-.01em}
.hl.next,.hl .next{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.hl.next b,.hl .next b{font-size:44px}
.hl .bar{background:#ffffff2e;height:8px;margin-top:14px}.hl .bar i{background:#fff}.hl .legend{display:flex;justify-content:space-between;font-size:12px;color:#cdeeea;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="wrap" id="app">Loading…</div>
<script>
window.onerror = (m, s, l) => { document.getElementById('app').textContent = 'Erreur : ' + m + ' (ligne ' + l + ')'; };
const PAGE = (new URLSearchParams(location.search).get('p') || 'resa'), URL_ = (location.origin + location.pathname);
const COLORS = {bleu:'#1e5bd8',cyan:'#19c3dd',vert:'#2e9d4f',jaune:'#f5c518',orange:'#f08a24',rouge:'#d93025',rose:'#ec6aa6',violet:'#7b4fd0','vert fluo':'#39ff14',blanc:'#ffffff',noir:'#222',gris:'#999'};
const col = c => COLORS[String(c||'').trim().toLowerCase()] || (String(c||'').trim() ? '#ccc' : 'transparent'); // pas de couleur = pas de bracelet
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d) => d === 'AUD' ? 'A$' + n : d === 'USD' ? 'US$' + n : Number(n).toLocaleString('fr-FR') + ' XPF';
const API = 'https://script.google.com/macros/s/AKfycbz2qCzvJuEiEthDIPyqn1AnPU1nnV990Phxccod0VuX-MGm-6mxgJ9e7hpHbnO0QmT6/exec';
const call = (fn, ...a) => window.google && google.script
  ? new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => ko(e.message || e))[fn](...a))
  : fetch(API, {method: 'POST', body: JSON.stringify({fn, args: a})}).then(r => r.json()).then(r => { if (!r.ok) throw r.error; return r.data; }, () => { throw 'Pas de connexion, réessaie.'; });
const IMG_ILOT = 'https://static.wixstatic.com/media/77dba7_f74071bf059f4a8fbfafdf814be456e3~mv2.jpg/v1/fill/w_1000,h_560,q_80/ilot.jpg';
const IMG_TORTUE = 'https://static.wixstatic.com/media/77dba7_8e210791d09c4fbbbcb2c1f7337a492d~mv2.jpeg/v1/fill/w_1000,h_620,q_80/tortue.jpg';
const IMG_LOGO = 'https://static.wixstatic.com/media/77dba7_9a4d59e107f2410b9c877ad6b03cdfcf~mv2.png';
const WAVE = '<svg viewBox="0 0 400 18" preserveAspectRatio="none"><path d="M0 10 Q50 0 100 10 T200 10 T300 10 T400 10 V18 H0Z" fill="#f3f6f9"/></svg>';
const HERO = (img, title, sub) => `<div class="hero"><img src="${img}" alt="">${title ? `<div class="cap"><b>${title}</b>${sub}</div>` : ''}${WAVE}</div>`;
const LOGO = '<header><img src="https://static.wixstatic.com/media/77dba7_9a4d59e107f2410b9c877ad6b03cdfcf~mv2.png" alt="Gakis"><div><h1>Îlot Maître taxi boat</h1><div class="mut">Gakis · Nouméa</div></div></header>';

// Icônes des vignettes : tracés simples, trait 2 px (pas de xmlns : Google retire les « // »)
const IC = {
  boat: '<path d="M3 16h18l-2.5 4h-13z"/><path d="M12 3v13"/><path d="M12 4l6 9h-6"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.4-3.3 2.8-5.5 6-5.5s5.6 2.2 6 5.5"/><path d="M16 4.8a3.2 3.2 0 0 1 0 6.3"/><path d="M18 14.8c1.7.7 2.8 2.6 3 5.2"/>',
  seat: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  chart: '<path d="M4 20V11M10 20V5M16 20v-6M3 20h18"/>',
  wallet: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/>'
};
const ico = (k, c) => `<span class="ic" style="--c:${c}"><svg viewBox="0 0 24 24">${IC[k]}</svg></span>`;
const tile = (k, c, v, l) => `<div class="tile">${ico(k, c)}<b>${v}</b><small>${l}</small></div>`;

/* ================= TOURISTES ================= */
let S = {depart:null, people:[{prenom:'',nom:'',type:'adulte',devise:'AUD',mode:'Cash'}], tel:'+61 ', ensemble:true, devise:'AUD', mode:'Cash'}, PUB = null, busy = false;
const TYPES = [['adulte','Adult'],['enfant','Child (2–9)'],['bebe','Baby under 2 (free)']];
function seg(key, opts, cur, i) {
  return '<div class="seg">' + opts.map(([v,l]) => `<button type="button" class="${v===cur?'on':''}" onclick="setv('${key}','${v}',${i??-1})">${l}</button>`).join('') + '</div>';
}
function setv(k, v, i) { if (k === 'ensemble' || k === 'gyg') v = !!v; if (i >= 0) S.people[i][k] = v; else S[k] = v; renderResa(); }
// Carte = toujours en francs CFP (terminal local) ; la devise ne se choisit qu'en cash
const PAY = (mode, devise, i) => `<label>By</label>${seg('mode',[['Cash','Cash'],['Carte','Card']],mode,i)}` +
  (mode === 'Carte' ? '<p class="mut" style="margin:8px 0 0">Card payments are charged in CFP francs.</p>' : `<label>Currency</label>${seg('devise',[['AUD','AUD $'],['USD','US $'],['XPF','CFP francs']],devise,i)}`);
function total() {
  const t = {};
  S.people.forEach(p => { const m = S.ensemble ? S.mode : p.mode, d = m === 'Carte' ? 'XPF' : (S.ensemble ? S.devise : p.devise);
    t[d] = (t[d]||0) + PUB.prices[p.type][m === 'Carte' ? 'CARTE' : d]; });
  return Object.entries(t).map(([d,n]) => fmt(n,d)).join(' + ') || '0';
}
function renderResa(err) {
  const a = document.activeElement, focusId = a && a.id, pos = a && a.selectionStart;
  if (PUB.ferme) { $('#app').innerHTML = LOGO + '<div class="card"><h2 style="margin:0 0 6px">Bookings are closed for today</h2><p class="mut">See you tomorrow! Questions? Ask at the Gakis desk.</p></div>'; return; }
  if (!PUB.deps.length) { $('#app').innerHTML = LOGO + '<div class="card"><h2 style="margin:0 0 6px">No boats open for booking right now</h2><p class="mut">Please ask at the Gakis desk.</p></div>'; return; }
  if (S.depart && !PUB.deps.some(d => d.id === S.depart)) S.depart = null;
  const many = S.people.length > 1;
  let h = LOGO + HERO(IMG_ILOT, 'Îlot Maître', '15 min by taxi boat from Nouméa · return trip included') + '<p class="mut">Book your seat here, then pay at the Gakis desk.</p>';
  h += '<h2>1. Choose your boat</h2>' + PUB.deps.map(d => `<div class="card dep ${d.id===S.depart?'sel':''}" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="S.depart='${d.id}';renderResa()">
     <div><div class="time">${d.heure}</div><div class="mut">Back from the island ${d.retour}</div></div><span class="seats">${d.id===S.depart?'✓ ':''}${d.libres} seat${d.libres>1?'s':''} left</span></div>`).join('');
  h += '<h2>2. Who is coming?</h2>' + S.people.map((p,i) => `<div class="card">
     <div class="row"><div><label>First name</label><input id="pf${i}" value="${esc(p.prenom)}" oninput="S.people[${i}].prenom=this.value" autocomplete="given-name"></div>
     <div><label>Last name</label><input id="pn${i}" value="${esc(p.nom)}" oninput="S.people[${i}].nom=this.value" autocomplete="family-name"></div></div>
     <label>Age</label>${seg('type', TYPES.map(([v,l])=>[v,l]), p.type, i)}
     ${many && !S.ensemble ? PAY(p.mode, p.devise, i) : ''}
     ${i ? `<p><button class="sm no" type="button" onclick="S.people.splice(${i},1);renderResa()">Remove</button></p>` : ''}</div>`).join('');
  h += `<button class="sec" type="button" onclick="S.people.push({prenom:'',nom:'',type:'adulte',devise:S.devise,mode:S.mode});renderResa()">+ Add a person</button>`;
  h += `<h2>3. Phone number <span class="mut">(optional)</span></h2><div class="card"><label>WhatsApp number with country code, so we can reach you while you are on the island</label><input id="tel" type="tel" value="${esc(S.tel)}" oninput="S.tel=this.value" autocomplete="tel"></div>`;
  h += '<h2>4. Payment at the desk</h2><div class="card"><label>Do you already have a GetYourGuide booking?</label>' + seg('gyg', [['','No, I pay at the desk'],['1','Yes, GetYourGuide']], S.gyg?'1':'');
  if (S.gyg) h += '<div class="total">Nothing to pay</div><p style="margin:0">Come to the Gakis desk, <b>show your GetYourGuide booking</b> and collect your bracelets.</p>';
  else {
  if (many) h += '<label>Pay</label>' + seg('ensemble', [['1','All together'],['','Separately']], S.ensemble?'1':'');
  if (!many || S.ensemble) h += PAY(S.mode, S.devise);
  if (!S.promoOpen && !S.promo) h += '<p style="margin:10px 0 0"><a href="#" onclick="S.promoOpen=1;renderResa();$(\'#promo\').focus();return false" style="color:var(--lagon);font-weight:600">+ Add promo code</a></p>';
  else h += `<label>Promo code</label><div class="row"><input id="promo" value="${esc(S.promo || '')}" autocapitalize="characters"><button type="button" class="sec" style="flex:none;width:auto;padding:0 18px" onclick="applyPromo()">Apply</button></div>`;
  if (S.promoTried && S.promo) h += PUB.promo ? '<p style="margin:6px 0 0;color:var(--ok);font-weight:700">✓ Promo code applied</p>' : '<p style="margin:6px 0 0;color:var(--warn)">This promo code is not valid.</p>';
  h += `<div class="total">Total: ${total()}</div>`;
  }
  if (!S.gyg && S.mode === 'Carte' && (!many || S.ensemble) && PUB.taux) { // équivalence indicative pour les touristes
    const x = S.people.reduce((t, p) => t + PUB.prices[p.type].CARTE, 0);
    if (x) h += `<p class="mut" style="text-align:right;margin:-6px 0 0">≈ A$${Math.round(x / PUB.taux.AUD)} · ≈ US$${Math.round(x / PUB.taux.USD)} (indicative, your bank sets the final rate)</p>`;
  }
  h += '</div>';
  h += (err ? `<div class="err">${esc(err)}</div>` : '') + `<button class="big" ${busy?'disabled':''} onclick="submitResa()">${busy?'Booking…':'Book my seat'}</button><p class="mut">Please be at the desk 10 minutes before departure.</p>`;
  $('#app').innerHTML = h;
  if (focusId && $('#'+focusId)) { const el = $('#'+focusId); el.focus(); try { el.setSelectionRange(pos,pos); } catch(e){} }
}
async function submitResa() {
  if (!S.depart) return renderResa('Please choose a boat.');
  if (S.people.some(p => !p.prenom.trim() || !p.nom.trim())) return renderResa('Please enter first and last name for everyone.');

// « Prénom Nom [enfant|bébé] » par ligne → passagers
function papier(txt) {
  return txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const w = l.split(/\s+/), last = w[w.length - 1].toLowerCase().replace(/[()]/g, '');
    const type = /^(enfant|kid|child)$/.test(last) ? 'enfant' : /^(b[ée]b[ée]|baby)$/.test(last) ? 'bebe' : 'adulte';
    if (type !== 'adulte' && w.length > 1) w.pop();
    return { prenom: w[0], nom: w.slice(1).join(' '), type };
  });
}

// Page 1 du bilan « à la Gakis » : dessinée en HTML (polices, aplats), photographiée par html2canvas puis mise en image dans le PDF
const H2C = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
const GFONTS = 'https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap';
const GK = {deep:'#015450', lagon:'#0f9a92', aqua:'#d7f7fc', mint:'#96fef9', corail:'#eb6834', bleu:'#2a78d6', ink:'#0d2b2a', mut:'#4f6b69'};
const loadScript = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
async function bilanImage(K, s) {
  if (!window.html2canvas) await loadScript(H2C);
  if (!document.getElementById('gkfonts')) document.head.insertAdjacentHTML('beforeend', `<link id="gkfonts" rel="stylesheet" href="${GFONTS}">`);
  await Promise.all(['400 14px "Work Sans"', '600 14px "Work Sans"', '700 14px "Work Sans"'].map(f => document.fonts.load(f)));
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:-3000px;top:0;width:794px;background:#fff';
  el.innerHTML = bilanPage(K, s);
  document.body.appendChild(el);
  try {
    // l'image doit tenir sur une page A4, sinon le convertisseur Google la repousse en page 2 (page 1 blanche)
    const c = await html2canvas(el, {scale: 1.5, backgroundColor: '#fff', logging: false}), H = Math.round(c.width * 1.40); // A4 pleine page (297/210 = 1.414)
    if (c.height <= H) return c.toDataURL('image/jpeg', 0.72);
    const f = document.createElement('canvas'), k = H / c.height, x = f.getContext('2d');
    f.width = c.width; f.height = H; x.fillStyle = '#fff'; x.fillRect(0, 0, f.width, H);
    x.drawImage(c, (c.width - c.width * k) / 2, 0, c.width * k, H);
    return f.toDataURL('image/jpeg', 0.72);
  }
  finally { el.remove(); }
}

      ${kpi('users', GK.bleu, s.pax, 'Passagers', [[s.adultes, 'adulte'], [s.enfants, 'enfant'], [s.bebes, 'bébé']].map(([v, w]) => v + ' ' + w + (v > 1 ? 's' : '')).join(' · '))}
      ${kpi('chart', GK.lagon, s.taux + ' %', 'Remplissage', s.occupe + ' / ' + s.cap + ' places')}
      ${kpi('boat', '#7b4fd0', K.deps.length, 'Bateaux', s.parSkipper.length + ' skipper' + (s.parSkipper.length > 1 ? 's' : ''))}</div>
    ${sec('Encaissements par mode')}
    <table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th style="${th}">Mode</th><th style="${th}${n}">Nb</th><th style="${th}${n}">Montant</th><th style="${th}${n}">≈ CFP</th><th style="${th}${n};width:70px">Part</th></tr>
      ${s.modes.map(m => `<tr><td style="${td}">${dot(m.c)}${m.l}</td><td style="${td}${n}">${m.nb}</td><td style="${td}${n};font-weight:700">${fmt(m.v, m.d)}</td><td style="${td}${n}">${fmt(m.cfp, 'XPF')}</td><td style="${td}${n}">${Math.round(m.cfp / (s.totalCfp || 1) * 100)} %</td></tr>`).join('')}

        ${['XPF', 'AUD', 'USD'].map(d => `<tr><td style="${td};font-weight:600">${d === 'XPF' ? 'CFP' : d}</td><td style="${td}${n}">${fmt(sum(d, 'Cash'), d)}</td><td style="${td}${n}">${fmt(FOND(d), d)}</td><td style="${td}${n};font-weight:700">${fmt(sum(d, 'Cash') + FOND(d), d)}</td></tr>`).join('')}</table>`)}

async function cloture(btn) {
  btn.disabled = true; btn.textContent = 'PDF…';
  const s = stats(K);
  let img = null;
  try { img = await bilanImage(K, s); } catch (e) { img = null; } // sans réseau : version simple
  const html = pdfHtml(K, s, img);
  try {

    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0)), url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));

  } catch (e) { alert(e); }
  btn.disabled = false; btn.textContent = 'Clôturer · PDF';
}

/* ================= SKIPPERS ================= */
async function loadSkipper() {
  const s = await call('getSkipper');
  const next = s.deps.filter(d => d.heure >= s.now), last = s.deps.filter(d => d.heure < s.now).slice(-1);
  const show = last.concat(next);
  let h = LOGO + `<p class="mut">Mis à jour à ${s.now}</p>`;
  if (!show.length) h += '<div class="card">Aucun départ prévu.</div>';
  h += show.map((d,i) => `<div class="card skip">
     <div class="row" style="align-items:flex-end"><div><div class="mut" style="display:flex;align-items:center"><span class="brace" style="background:${col(d.couleur)}"></span>${d.heure < s.now ? 'Parti' : i === last.length ? 'Prochain bateau' : 'Ensuite'}</div><div class="${i===last.length?'now':'time'}">${d.heure}</div></div>
     <div style="text-align:right"><div class="seats">${d.pris}<span class="mut" style="font-size:20px">/${d.capacite}</span></div><div class="mut">${d.payes} payés · ${d.bloquees} réservée(s)</div></div></div>
     <div class="bar"><i style="width:${Math.min(100,d.pris/d.capacite*100)}%"></i></div>
     ${(d.taxi||[]).map(t => `<div class="alert" style="margin-top:12px;font-size:20px">🚕 Taxi ${esc(t.p)} · ${t.nb} pers. <span style="font-size:14px;font-weight:600">(leurs clients)</span></div>`).join('')}
     <p style="margin:8px 0 0">${d.couleur ? `Bracelet <span class="chip" style="background:${col(d.couleur)}"></span><b>${esc(d.couleur)}</b> · ` : (d.taxi||[]).length ? 'Pas de bracelet · ' : ''}Retour <b>${d.retour}</b> · Skipper <b>${esc(d.skipper||'—')}</b></p></div>`).join('');
  $('#app').innerHTML = h;
}

/* ================= ÎLOT (agent sur place) ================= */
async function loadIlot() {
  const s = await call('getIlot'), pl = (n, a, b) => n + ' ' + (n > 1 ? b : a);
  // sur l'îlot = parti (ou heure passée) et pas encore l'heure du retour
  const etat = d => (d.parti || d.heure <= s.now) ? (d.retour > s.now ? 'ilot' : 'rentre') : 'avenir';
  const bloc = (titre, list) => list.length ? `<h2>${titre}</h2>` + list.map(d => `<div class="card">
      <div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="font:600 22px/1.2 var(--disp);color:var(--deep);white-space:nowrap">${d.couleur ? `<span class="brace" style="background:${col(d.couleur)}"></span>Bracelet ${esc(d.couleur)}` : 'Pas de bracelet'}</div>
        <div class="mut">Bateau ${d.heure}${d.parti ? ' (parti ' + d.parti + ')' : ''} · ${esc(d.skipper || '—')}</div></div>
        <div style="text-align:right;flex:none"><div class="mut">Retour</div><div class="time" style="font-size:32px">${d.retour}</div></div></div>
      <p style="margin:8px 0;font-weight:700">${[pl(d.pax, 'personne', 'personnes'), d.a && pl(d.a, 'adulte', 'adultes'), d.e && pl(d.e, 'enfant', 'enfants'), d.b && pl(d.b, 'bébé', 'bébés')].filter(Boolean).join(' · ')}</p>
      ${d.taxi.map(t => `<div class="alert">🚕 Taxi ${esc(t.p)} · ${t.nb} pers.</div>`).join('')}
      ${d.groupes.map(g => `<div style="border-top:1px solid var(--line);padding:6px 0">${g.map(p => esc(p.prenom + ' ' + p.nom) + (p.type === 'enfant' ? ' <span class="mut">(enfant)</span>' : p.type === 'bebe' ? ' <span class="mut">(bébé)</span>' : '')).join(', ')}</div>`).join('')}
      ${Number(d.bloquees) ? `<div class="mut" style="border-top:1px solid var(--line);padding-top:6px">+ ${d.bloquees} place(s) réservée(s)</div>` : ''}</div>`).join('') : '';
  const by = e => s.deps.filter(d => etat(d) === e);
  let h = LOGO + `<p class="mut">Vue îlot · mis à jour à ${s.now}</p>`;
  h += bloc('Sur l’îlot', by('ilot').sort((a, b) => a.retour.localeCompare(b.retour))) + bloc('Arrivent ensuite', by('avenir')) + bloc('Déjà rentrés', by('rentre'));
  if (!s.deps.length) h += '<div class="card">Aucun bateau aujourd’hui.</div>';
  $('#app').innerHTML = h;
}
