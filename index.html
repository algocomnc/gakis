<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gakis — Îlot Maître</title>
<style>summary::-webkit-details-marker{display:none}
:root{--ink:#0d2238;--mut:#5b6b7c;--bg:#f3f6f9;--card:#fff;--blue:#0b5fa5;--ok:#1d8a4e;--warn:#c0392b;--line:#dde4ea}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}header img{height:44px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:20px 0 8px}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
input{-webkit-appearance:none;appearance:none}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;min-width:0;display:block;min-height:46px;font:inherit;padding:11px;border:1px solid #c5d0da;border-radius:8px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 16px;background:var(--blue);color:#fff;cursor:pointer}
button.sec{background:#e6eef5;color:var(--blue)}button.ok{background:var(--ok)}button.no{background:#fbeaea;color:var(--warn)}
button.sm{padding:8px 11px;font-size:14px}button:disabled{opacity:.5}
.big{width:100%;font-size:18px;padding:16px}
.dep{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.dep.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.time{font-size:22px;font-weight:700}
.seg{display:flex;gap:6px}.seg button{flex:1;background:#e6eef5;color:var(--ink);font-weight:500}.seg button.on{background:var(--blue);color:#fff}
.chip{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid #0003;vertical-align:-3px;margin-right:4px}
.err{color:var(--warn);font-weight:600;margin:8px 0}
.total{font-size:20px;font-weight:700;text-align:right;margin:12px 0}
.tag{font-size:12px;padding:2px 7px;border-radius:20px;background:#eef2f5}.tag.p{background:#d9f2e3;color:var(--ok)}.tag.a{background:#fff1d6;color:#9a6200}.tag.x{background:#fbeaea;color:var(--warn)}
.code{font-size:44px;font-weight:800;letter-spacing:4px;text-align:center}
.skip .now{font-size:64px;font-weight:800;line-height:1}.skip .seats{font-size:40px;font-weight:800}
.bar{height:10px;border-radius:5px;background:#e6eef5;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right;white-space:nowrap}
.hero{position:relative;border-radius:14px;overflow:hidden;margin-bottom:14px;background:#0b5fa5}
.hero img{display:block;width:100%;height:190px;object-fit:cover}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 26px;color:#fff;background:linear-gradient(transparent,#0008)}
.hero .cap b{font-size:22px;display:block}.hero svg{position:absolute;left:0;bottom:-1px;width:100%;height:18px}
.vivre{list-style:none;padding:0;margin:10px 0 0;text-align:left}.vivre li{padding:8px 0 8px 30px;position:relative;border-bottom:1px solid var(--line)}
.vivre li span{position:absolute;left:0;top:7px;font-size:18px}
.x{text-decoration:line-through;opacity:.5}a{color:var(--blue)}
</style></head>
<body><div class="wrap" id="app">Loading…</div>
<script>
window.onerror = (m, s, l) => { document.getElementById('app').textContent = 'Erreur : ' + m + ' (ligne ' + l + ')'; };
const PAGE = (new URLSearchParams(location.search).get('p') || 'resa'), URL_ = (location.origin + location.pathname);
const COLORS = {bleu:'#1e5bd8',cyan:'#19c3dd',vert:'#2e9d4f',jaune:'#f5c518',orange:'#f08a24',rouge:'#d93025',rose:'#ec6aa6',violet:'#7b4fd0','vert fluo':'#39ff14',blanc:'#ffffff',noir:'#222',gris:'#999'};
const col = c => COLORS[String(c||'').trim().toLowerCase()] || '#ccc';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d) => d === 'AUD' ? 'A$' + n : d === 'USD' ? 'US$' + n : Number(n).toLocaleString('fr-FR') + ' XPF';
const API = 'https://script.google.com/macros/s/AKfycbz2qCzvJuEiEthDIPyqn1AnPU1nnV990Phxccod0VuX-MGm-6mxgJ9e7hpHbnO0QmT6/exec';
const call = (fn, ...a) => window.google && google.script
  ? new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => ko(e.message || e))[fn](...a))
  : fetch(API, {method: 'POST', body: JSON.stringify({fn, args: a})}).then(r => r.json()).then(r => { if (!r.ok) throw r.error; return r.data; }, () => { throw 'Pas de connexion, réessaie.'; });
const IMG_ILOT = 'https://static.wixstatic.com/media/77dba7_f74071bf059f4a8fbfafdf814be456e3~mv2.jpg/v1/fill/w_1000,h_560,q_80/ilot.jpg';
const IMG_TORTUE = 'https://static.wixstatic.com/media/77dba7_8e210791d09c4fbbbcb2c1f7337a492d~mv2.jpeg/v1/fill/w_1000,h_620,q_80/tortue.jpg';
const IMG_LOGO = 'https://static.wixstatic.com/media/77dba7_9a4d59e107f2410b9c877ad6b03cdfcf~mv2.png';
const WAVE = '<svg viewBox="0 0 400 18" preserveAspectRatio="none"><path d="M0 10 Q50 0 100 10 T200 10 T300 10 T400 10 V18 H0Z" fill="#f3f6f9"/></svg>';
const HERO = (img, title, sub) => `<div class="hero"><img src="${img}" alt="">${title ? `<div class="cap"><b>${title}</b>${sub}</div>` : ''}${WAVE}</div>`;
const LOGO = '<header><img src="https://static.wixstatic.com/media/77dba7_9a4d59e107f2410b9c877ad6b03cdfcf~mv2.png" alt="Gakis"><div><h1>Îlot Maître taxi boat</h1><div class="mut">Gakis · Nouméa</div></div></header>';

/* ================= TOURISTES ================= */
let S = {depart:null, people:[{prenom:'',nom:'',type:'adulte',devise:'AUD',mode:'Cash'}], tel:'+61 ', ensemble:true, devise:'AUD', mode:'Cash'}, PUB = null, busy = false;
const TYPES = [['adulte','Adult'],['enfant','Child (2–9)'],['bebe','Baby under 2 (free)']];
function seg(key, opts, cur, i) {
  return '<div class="seg">' + opts.map(([v,l]) => `<button type="button" class="${v===cur?'on':''}" onclick="setv('${key}','${v}',${i??-1})">${l}</button>`).join('') + '</div>';
}
function setv(k, v, i) { if (k === 'ensemble') v = !!v; if (i >= 0) S.people[i][k] = v; else S[k] = v; renderResa(); }
// Carte = toujours en francs CFP (terminal local) ; la devise ne se choisit qu'en cash
const PAY = (mode, devise, i) => `<label>By</label>${seg('mode',[['Cash','Cash'],['Carte','Card']],mode,i)}` +
  (mode === 'Carte' ? '<p class="mut" style="margin:8px 0 0">Card payments are charged in CFP francs.</p>' : `<label>Currency</label>${seg('devise',[['AUD','AUD $'],['USD','US $'],['XPF','CFP francs']],devise,i)}`);
function total() {
  const t = {};
  S.people.forEach(p => { const m = S.ensemble ? S.mode : p.mode, d = m === 'Carte' ? 'XPF' : (S.ensemble ? S.devise : p.devise);
    t[d] = (t[d]||0) + PUB.prices[p.type][m === 'Carte' ? 'CARTE' : d]; });
  return Object.entries(t).map(([d,n]) => fmt(n,d)).join(' + ') || '0';
}
function renderResa(err) {
  const a = document.activeElement, focusId = a && a.id, pos = a && a.selectionStart;
  if (PUB.ferme) { $('#app').innerHTML = LOGO + '<div class="card"><b>Bookings are closed for today.</b><p class="mut">See you tomorrow! Questions? Ask at the Gakis desk.</p></div>'; return; }
  if (!PUB.deps.length) { $('#app').innerHTML = LOGO + '<div class="card"><b>No boats open for booking right now.</b><p class="mut">Please ask at the Gakis desk.</p></div>'; return; }
  if (S.depart && !PUB.deps.some(d => d.id === S.depart)) S.depart = null;
  const many = S.people.length > 1;
  let h = LOGO + HERO(IMG_ILOT, 'Îlot Maître', '15 min by taxi boat from Nouméa · return trip included') + '<p class="mut">Book your seat here, then pay at the Gakis desk.</p>';
  h += '<h2>1. Choose your boat</h2>' + PUB.deps.map(d => `<div class="card dep ${d.id===S.depart?'sel':''}" onclick="S.depart='${d.id}';renderResa()">
     <div><div class="time">${d.heure}</div><div class="mut">Back from the island ${d.retour}</div></div><div><b>${d.libres}</b> <span class="mut">seat${d.libres>1?'s':''} left</span></div></div>`).join('');
  h += '<h2>2. Who is coming?</h2>' + S.people.map((p,i) => `<div class="card">
     <div class="row"><div><label>First name</label><input id="pf${i}" value="${esc(p.prenom)}" oninput="S.people[${i}].prenom=this.value" autocomplete="given-name"></div>
     <div><label>Last name</label><input id="pn${i}" value="${esc(p.nom)}" oninput="S.people[${i}].nom=this.value" autocomplete="family-name"></div></div>
     <label>Age</label>${seg('type', TYPES.map(([v,l])=>[v,l]), p.type, i)}
     ${many && !S.ensemble ? PAY(p.mode, p.devise, i) : ''}
     ${i ? `<p><button class="sm no" type="button" onclick="S.people.splice(${i},1);renderResa()">Remove</button></p>` : ''}</div>`).join('');
  h += `<button class="sec" type="button" onclick="S.people.push({prenom:'',nom:'',type:'adulte',devise:S.devise,mode:S.mode});renderResa()">+ Add a person</button>`;
  h += `<h2>3. Phone number <span class="mut">(optional)</span></h2><div class="card"><label>WhatsApp number with country code, so we can reach you while you are on the island</label><input id="tel" type="tel" value="${esc(S.tel)}" oninput="S.tel=this.value" autocomplete="tel"></div>`;
  h += '<h2>4. Payment at the desk</h2><div class="card">';
  if (many) h += '<label>Pay</label>' + seg('ensemble', [['1','All together'],['','Separately']], S.ensemble?'1':'');
  if (!many || S.ensemble) h += PAY(S.mode, S.devise);
  h += `<div class="total">Total: ${total()}</div>`;
  if (S.mode === 'Carte' && (!many || S.ensemble) && PUB.taux) { // équivalence indicative pour les touristes
    const x = S.people.reduce((t, p) => t + PUB.prices[p.type].CARTE, 0);
    if (x) h += `<p class="mut" style="text-align:right;margin:-6px 0 0">≈ A$${Math.round(x / PUB.taux.AUD)} · ≈ US$${Math.round(x / PUB.taux.USD)} (indicative, your bank sets the final rate)</p>`;
  }
  h += '</div>';
  h += (err ? `<div class="err">${esc(err)}</div>` : '') + `<button class="big" ${busy?'disabled':''} onclick="submitResa()">${busy?'Booking…':'Book my seat'}</button><p class="mut">Please be at the desk 10 minutes before departure.</p>`;
  $('#app').innerHTML = h;
  if (focusId && $('#'+focusId)) { const el = $('#'+focusId); el.focus(); try { el.setSelectionRange(pos,pos); } catch(e){} }
}
async function submitResa() {
  if (!S.depart) return renderResa('Please choose a boat.');
  if (S.people.some(p => !p.prenom.trim() || !p.nom.trim())) return renderResa('Please enter first and last name for everyone.');
  busy = true; renderResa();
  try {
    const r = await call('book', {depart:S.depart, people:S.people, tel:S.tel, ensemble:S.ensemble, devise:S.devise, mode:S.mode});
    const sums = {}; r.rows.forEach(x => sums[x.devise] = (sums[x.devise]||0) + Number(x.montant));
    $('#app').innerHTML = LOGO + `<div class="card" style="text-align:center"><p class="mut">Your booking number</p><div class="code">${r.groupe}</div>
      <p><b>Boat ${r.heure}</b> · back from the island ${r.retour}</p><p>${r.rows.map(x=>esc(x.prenom)).join(', ')}</p>
      <div class="total" style="text-align:center">To pay: ${Object.entries(sums).map(([d,n])=>fmt(n,d)).join(' + ')}</div>
      <p><b>Show this screen at the Gakis desk to pay.</b><br>Be there 10 minutes before departure. Take a screenshot!</p></div>
      <h2>What awaits you</h2>${HERO(IMG_TORTUE)}<p style="margin:-4px 0 10px"><b>One of the most beautiful lagoons in the world.</b> Îlot Maître is a preserved island 15 minutes from Nouméa.</p>
      <div class="card"><ul class="vivre">
        <li><span>🐢</span><b>Lagoon wildlife</b><br><span class="mut" style="position:static;font-size:14px">Snorkel among corals, fish and, with luck, sea turtles</span></li>
        <li><span>🤿</span><b>Masks and snorkels provided</b><br><span class="mut" style="position:static;font-size:14px">At no extra cost, just ask your skipper</span></li>
        <li><span>🏝️</span><b>White sand and turquoise water</b><br><span class="mut" style="position:static;font-size:14px">${r.retour ? 'About 3 hours on the island, boat back at ' + r.retour : ''}</span></li>
        <li><span>🍹</span><b>Food and drinks on the island</b><br><span class="mut" style="position:static;font-size:14px">Restaurant on site (not included) or bring your picnic · sun loungers available</span></li>
        <li><span>☀️</span><b>Bring</b><br><span class="mut" style="position:static;font-size:14px">Swimsuit, towel, hat, reef-safe sunscreen and water</span></li>
      </ul></div>`;
  } catch (e) { busy = false; await loadPub(); renderResa(String(e)); }
}
async function loadPub() { PUB = await call('getPublic'); }

/* ================= CAISSE ================= */
let C = null, PIN = '', filt = 'attente', VIEW = 'caisse', K = null, KDATE = '';
try { PIN = localStorage.getItem('gakisPin') || ''; } catch(e) {}
function pinScreen(err) {
  $('#app').innerHTML = LOGO + `<div class="card"><label>Code caisse</label><input id="pin" type="password" inputmode="numeric"><div class="err">${err||''}</div><button class="big" onclick="PIN=$('#pin').value;loadCaisse()">Entrer</button></div>`;
}
async function loadCaisse() {
  try { C = await call('getCaisse', PIN); try { localStorage.setItem('gakisPin', PIN); } catch(e) {} renderCaisse(); }
  catch (e) { pinScreen(e); }
}
let OPEN = new Set(), FLASH = '', NEW = {}; // NEW = saisie du formulaire « Nouveau départ », gardée entre deux rafraîchissements
async function fermer() { await act('fermer', {ferme: true}); if (C.ferme) { VIEW = 'compta'; loadCompta(); } }
async function act(action, a) {
  document.activeElement && document.activeElement.blur();
  FLASH = 'Enregistrement…'; renderCaisse();
  try {
    C = await call('caisse', PIN, action, a);
    FLASH = action === 'addDep' ? '✓ Départ de ' + a.heure + ' ajouté' : '✓ Enregistré';
    if (action === 'addDep') NEW = {};
  } catch (e) { FLASH = '⚠ Pas enregistré : ' + e; }
  renderCaisse(); setTimeout(() => { FLASH = ''; renderCaisse(); }, 4000);
}
// « Prénom Nom [enfant|bébé] » par ligne → passagers
function papier(txt) {
  return txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const w = l.split(/\s+/), last = w[w.length - 1].toLowerCase().replace(/[()]/g, '');
    const type = /^(enfant|kid|child)$/.test(last) ? 'enfant' : /^(b[ée]b[ée]|baby)$/.test(last) ? 'bebe' : 'adulte';
    if (type !== 'adulte' && w.length > 1) w.pop();
    return { prenom: w[0], nom: w.slice(1).join(' '), type };
  });
}
const DRAFT = {};
async function addManuel(id) {
  const people = papier($('#pn-' + id).value);
  if (!people.length) { alert('Écris au moins un nom'); return; }
  const a = { depart: id, people, mode: $('#pm-' + id).value, devise: $('#pd-' + id).value, montant: $('#px-' + id).value };
  const txt = DRAFT[id]; DRAFT[id] = ''; await act('addManuel', a);
  if (FLASH.startsWith('⚠')) { DRAFT[id] = txt; renderCaisse(); } // échec : on garde la saisie
}
function renderCaisse() {
  if (document.activeElement && document.activeElement.matches('input,select,textarea')) return; // ne pas écraser une saisie en cours
  if (VIEW === 'compta') return;
  const dep = id => C.deps.find(d => d.id === id) || {};
  let h = LOGO + TABS() + `<div class="row" style="margin-bottom:8px"><a class="sm sec" style="text-align:center;padding:9px;border-radius:10px;background:#e6eef5;text-decoration:none;font-weight:600" href="${URL_}" target="_blank">Vue client</a><a style="text-align:center;padding:9px;border-radius:10px;background:#e6eef5;text-decoration:none;font-weight:600" href="${URL_}?p=skipper" target="_blank">Vue skippers</a><a style="text-align:center;padding:9px;border-radius:10px;background:#e6eef5;text-decoration:none;font-weight:600" href="${URL_}?p=qr" target="_blank">QR à imprimer</a></div>`;
  h += C.ferme
    ? `<div class="card" style="border-left:6px solid var(--warn)"><b>Journée clôturée</b><p class="mut" style="margin:4px 0 10px">Les réservations en ligne sont fermées (elles rouvrent toutes seules demain).</p><div class="row"><button onclick="VIEW='compta';loadCompta()">Compta · PDF</button><button class="sec" onclick="act('fermer',{ferme:false})">Rouvrir</button></div></div>`
    : '';
  h += `<h2>Départs du jour (${C.deps.length})</h2><div class="card" style="padding:4px 14px">` + (C.deps.length ? '' : '<p class="mut">Aucun départ. Ajoute le premier ci-dessous.</p>') + C.deps.map((d, i) => `<details ${OPEN.has(d.id)?'open':''} ontoggle="this.open?OPEN.add('${d.id}'):OPEN.delete('${d.id}')" style="border-bottom:1px solid var(--line);padding:10px 0">
      <summary style="display:flex;align-items:center;gap:8px;cursor:pointer"><span class="mut">${i+1}.</span><span class="chip" style="background:${col(d.couleur)}"></span><b style="font-size:19px">${d.heure}</b>
        <span class="mut" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.skipper||'—')}</span>${d.parti ? `<span class="tag p">parti ${d.parti}</span>` : ''}<b>${d.pris}/${d.capacite}</b></summary>
      <div class="bar"><i style="width:${Math.min(100,d.pris/d.capacite*100)}%"></i></div>
      ${d.parti ? `<div class="row" style="margin-top:8px;align-items:center"><b style="color:var(--ok)">✓ Bateau parti à ${d.parti}</b><button class="sm sec" onclick="act('editDep',{id:'${d.id}',field:'parti',value:''})">Annuler</button></div>`
        : `<p style="margin:8px 0 0"><button style="width:100%" onclick="if(confirm('Le bateau de ${d.heure} est parti ?'))act('editDep',{id:'${d.id}',field:'parti',value:'1'})">⛵ Confirmer bateau parti</button></p>`}
      <p class="mut" style="margin:6px 0">Retour ${d.retour} · ${d.payes} payés · ${d.bloquees} bloquées</p>
      <div class="row"><select onchange="act('editDep',{id:'${d.id}',field:'heure',value:this.value})">${TIMES(d.heure)}</select>
        <select onchange="act('editDep',{id:'${d.id}',field:'couleur',value:this.value})"><option value="">Couleur…</option>${C.couleurs.map(c=>`<option ${c===d.couleur?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="row" style="margin-top:8px"><select onchange="act('editDep',{id:'${d.id}',field:'skipper',value:this.value})">${['',...C.skippers].map(k=>`<option value="${esc(k)}" ${k===d.skipper?'selected':''}>${esc(k||'Skipper…')}</option>`).join('')}</select></div>
      <div class="row" style="margin-top:8px;align-items:center"><span class="mut">Bloq.</span>
        <button class="sm sec" onclick="act('editDep',{id:'${d.id}',field:'bloquees',value:Math.max(0,${Number(d.bloquees)}-1)})">−1</button>
        <button class="sm sec" onclick="act('editDep',{id:'${d.id}',field:'bloquees',value:${Number(d.bloquees)}+1})">+1</button>
        <button class="sm" onclick="exportDep('${d.id}')">Exporter</button>
        ${d.pris == d.bloquees ? `<button class="sm no" onclick="if(confirm('Supprimer le départ ${d.heure} ?'))act('delDep',{id:'${d.id}'})">✕</button>` : ''}</div>
      ${(() => { const l = C.resas.filter(r => r.depart === d.id && r.statut !== 'annulé'); return l.length ? `<div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)"><b>Passagers (${l.length})</b>${l.map((r, j) => `<div class="row" style="align-items:center;margin-top:4px;${j && l[j-1].groupe !== r.groupe ? 'border-top:1px solid var(--line);padding-top:4px' : ''}"><span>${esc(r.prenom)} ${esc(r.nom)} <span class="mut">${r.type==='enfant'?'enfant':r.type==='bebe'?'bébé':''}</span></span><span style="text-align:right">${fmt(r.montant,r.devise)} · ${r.mode} <span class="tag ${r.statut==='payé'?'p':'a'}">${r.statut}</span></span></div>`).join('')}</div>` : ''; })()}
      <details ${OPEN.has('p-'+d.id)?'open':''} ontoggle="this.open?OPEN.add('p-${d.id}'):OPEN.delete('p-${d.id}')" style="margin-top:10px"><summary style="list-style:none;cursor:pointer;text-align:center;padding:11px;border-radius:10px;background:var(--ok);color:#fff;font-weight:700">+ Ajouter des passagers (feuille papier)</summary>
        <p class="mut" style="margin:8px 0 0">Un groupe qui a déjà payé</p>
        <textarea id="pn-${d.id}" oninput="DRAFT['${d.id}']=this.value" rows="3" style="width:100%;margin-top:6px;font:inherit" placeholder="Un passager par ligne : Prénom Nom&#10;ajoute « enfant » ou « bébé » en fin de ligne">${esc(DRAFT[d.id]||'')}</textarea>

// Heures par pas de 10 min (08:00 → 13:00), proposé : 20 min après le dernier départ
const TIMES = sel => Array.from({length: 31}, (_, i) => { const m = 480 + i * 10, t = String(m / 60 | 0).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); return `<option ${t === sel ? 'selected' : ''}>${t}</option>`; }).join('');
function NEXT() {
  const last = C.deps.length ? C.deps[C.deps.length - 1].heure : C.now, [a, b] = last.split(':').map(Number);
  const m = Math.min(780, Math.max(480, Math.ceil((a * 60 + b + (C.deps.length ? 20 : 0)) / 10) * 10));
  return String(m / 60 | 0).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

// fond de caisse laissé chaque jour : s'ajoute aux espèces encaissées dans « à avoir en caisse »
const FOND = d => Number((K && K.fond || {})[d]) || 0;
const FONDTXT = () => ['XPF','AUD','USD'].filter(d => FOND(d)).map(d => fmt(FOND(d), d)).join(' + ');

async function loadCompta(date) {

// Un encaissement = un groupe qui paie ensemble, ou une personne qui paie seule
function stats(K) {
  const live = K.resas.filter(r => r.statut !== 'annulé'), n = t => live.filter(r => r.type === t).length;
  const enc = {};
  live.forEach(r => { const k = (r.ensemble === 'oui' ? r.groupe : r.id) + '|' + r.statut; (enc[k] = enc[k] || []).push(r); });
  const tx = Object.values(enc).map(g => ({ groupe: g[0].groupe, dep: K.deps.find(d => d.id === g[0].depart) || {}, statut: g[0].statut,
    noms: g[0].mode === 'Refacturé' ? g[0].prenom + ' (taxi, ' + g.length + ' pers.)' : g.map(r => r.prenom + ' ' + r.nom).join(', '), a: g.filter(r=>r.type==='adulte').length, e: g.filter(r=>r.type==='enfant').length, b: g.filter(r=>r.type==='bebe').length,
    devise: g[0].devise, mode: g[0].mode, montant: g.reduce((s, r) => s + Number(r.montant), 0) }));
  const tot = (st, dev, mode) => tx.filter(t => t.statut === st && t.devise === dev && (!mode || t.mode === mode));
  const cap = K.deps.reduce((s, d) => s + Number(d.capacite), 0), pax = live.length;
  // Chaque devise reste séparée ; seul le « total journée » convertit AUD/USD en CFP au taux des réglages
  const rate = K.taux || {AUD: 72, USD: 110}, cfp = (v, d) => d === 'XPF' ? v : Math.round(v * rate[d]);
  const caisse = [['Cash','XPF'],['Cash','AUD'],['Cash','USD'],['Carte','XPF']].map(([m,d]) => { const l = tot('payé', d, m), v = l.reduce((s,t)=>s+t.montant,0); return { m, d, nb: l.length, v, cfp: cfp(v, d) }; });
  const modes = [[3,'Carte (CFP)',PAYC.carte],[0,'Cash CFP',PAYC.xpf],[1,'Cash AUD',PAYC.aud],[2,'Cash USD',PAYC.usd]].map(([i,l,c]) => Object.assign({ l, c }, caisse[i]));
  const totalCfp = modes.reduce((t, m) => t + m.cfp, 0), carteCfp = caisse[3].cfp;
  const refact = Object.values(tx.filter(t => t.mode === 'Refacturé').reduce((o, t) => { const p = t.noms.split(' (taxi')[0], x = o[p] = o[p] || { p, nb: 0, v: 0 }; x.nb += t.a; x.v += t.montant; return o; }, {}));
  return { refact, adultes: n('adulte'), enfants: n('enfant'), bebes: n('bebe'), pax, cap, taux: cap ? Math.round(pax / cap * 100) : 0, tx, rate,
    caisse, modes, totalCfp, carteCfp, cashCfp: totalCfp - carteCfp,
    attente: ['XPF','AUD','USD'].map(d => { const l = tot('attente', d); return { d, nb: l.length, v: l.reduce((s,t)=>s+t.montant,0) }; }) };
}
function comptaHtml(K, s) {

      <tr><td>Adultes</td><td class="n"><b>${s.adultes}</b></td></tr><tr><td>Enfants (2–9 ans)</td><td class="n"><b>${s.enfants}</b></td></tr>

      <tr><td colspan="3"><b>Total journée</b> <span class="mut">(carte ${fmt(s.carteCfp,'XPF')} · cash ≈ ${fmt(s.cashCfp,'XPF')})</span></td><td class="n"><b>${fmt(s.totalCfp, 'XPF')}</b></td></tr></table>
      <p class="mut" style="font-size:13px">AUD et USD convertis au taux des réglages (1 A$ = ${s.rate.AUD} F · 1 US$ = ${s.rate.USD} F), pour le total seulement.</p>
      <p><b>Espèces à avoir en caisse</b> (à compter séparément) :<br>${fmt(s.caisse[0].v + FOND('XPF'),'XPF')} · ${fmt(s.caisse[1].v + FOND('AUD'),'AUD')} · ${fmt(s.caisse[2].v + FOND('USD'),'USD')}${FONDTXT() ? `<br><span class="mut">dont fond de caisse : ${FONDTXT()}</span>` : ''}</p></div>
    <h2>Reste à encaisser</h2><div class="card"><table>${s.attente.map(a => `<tr><td>${a.d}</td><td class="n">${a.nb} encaissement(s)</td><td class="n"><b>${fmt(a.v, a.d)}</b></td></tr>`).join('')}</table></div>
${s.refact.length ? `<h2>À refacturer (taxi partenaires)</h2><div class="card"><table>${s.refact.map(x => `<tr><td>${esc(x.p)}</td><td class="n">${x.nb} pers.</td><td class="n"><b>${fmt(x.v, 'XPF')}</b></td></tr>`).join('')}</table></div>` : ''}
    <h2>Bateaux · taux d'occupation ${s.taux} %</h2><div class="card"><table><tr><th>Départ</th><th>Skipper</th><th>Bracelet</th><th class="n">Passagers</th><th class="n">Taux</th></tr>
      ${K.deps.map(d => { const p = K.resas.filter(r => r.depart === d.id && r.statut !== 'annulé').length; return `<tr><td>${d.heure}</td><td>${esc(d.skipper)}</td><td>${esc(d.couleur)}</td><td class="n">${p}/${d.capacite}</td><td class="n">${Math.round(p / d.capacite * 100)} %</td></tr>`; }).join('')}
      <tr><td colspan="3"><b>Total</b></td><td class="n"><b>${s.pax}/${s.cap}</b></td><td class="n"><b>${s.taux} %</b></td></tr></table></div>
    <h2>Détail des encaissements</h2><div class="card"><table><tr><th>Départ</th><th>Code</th><th>Noms</th><th class="n">Montant</th><th>Statut</th></tr>
      ${s.tx.sort((a,b)=>String(a.dep.heure).localeCompare(b.dep.heure)).map(t => `<tr><td>${t.dep.heure||''}</td><td>${t.groupe}</td><td>${esc(t.noms)} <span class="mut">(${lbl(t)})</span></td><td class="n">${fmt(t.montant,t.devise)} ${t.mode}</td><td>${t.statut}</td></tr>`).join('')}</table></div>`;
}

// PDF de clôture : page 1 visuelle, page 2 détail. Mise en page en tableaux (le convertisseur PDF de Google ignore flex/grid)
const SER = {a:'#0f9a92', e:'#eb6834', b:'#2a78d6'};
const PAYC = {carte:'#eb6834', xpf:'#0f9a92', aud:'#2a78d6', usd:'#eda100'}; // palette validée (dataviz), libellés toujours visibles // palette validée (dataviz) : lagon, corail, bleu
function bar(parts, h) { // barre empilée dessinée en bordures (le convertisseur PDF de Google ignore les fonds) ; libellé sous chaque segment

  return `<table style="width:100%;border-collapse:separate;border-spacing:3px 0"><tr>${seg.map(p =>
    `<td style="width:${p[0] / tot * 100}%;border-top:${h||22}px solid ${p[1]};padding:3px 0 0;font-size:10px;font-weight:bold;color:#0d2238">${p[2] || ''}</td>`).join('') || `<td style="border-top:${h||22}px solid #e6eef5"></td>`}</tr></table>`;
}
